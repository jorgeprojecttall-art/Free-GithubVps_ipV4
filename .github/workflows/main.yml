name: VPS via Tailscale

on:
  workflow_dispatch:

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscaled &
          sleep 5
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-vps

      - name: Setup user and SSH
        run: |
          sudo apt update
          sudo apt install -y openssh-server
          sudo systemctl start ssh
          
          # Create user
          sudo useradd -m -s /bin/bash itz_ytansh || true
          echo "itz_ytansh:itz_ytansh" | sudo chpasswd
          sudo usermod -aG sudo itz_ytansh
          echo "itz_ytansh ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/itz_ytansh

      - name: Show connection info
        run: |
          echo "=============================================="
          echo "✅ VPS ЗАПУЩЕН И ГОТОВ К ПОДКЛЮЧЕНИЮ!"
          echo "=============================================="
          echo ""
          echo "🔗 Tailscale IP: $(tailscale ip -4)"
          echo ""
          echo "📝 Команда для подключения:"
          echo "ssh itz_ytansh@$(tailscale ip -4)"
          echo ""
          echo "🔑 Пароль: itz_ytansh"
          echo "=============================================="

      - name: Keep VPS alive
        run: sleep 21600
