name: Free VPS Session

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  vps-session:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Tailscale and dependencies
        run: |
          sudo apt update
          sudo apt install -y curl
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Start Tailscale
        run: |
          sudo tailscaled &
          sleep 10
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTHKEY }} --hostname=my-vps

      - name: Show Tailscale IP
        run: |
          echo "=========================================="
          echo "✅ VPS SUCCESSFULLY STARTED!"
          echo "=========================================="
          echo ""
          echo "🔗 Connect via Tailscale:"
          echo "ssh itz_ytansh@$(tailscale ip -4)"
          echo ""
          echo "📝 Password: itz_ytansh"
          echo "=========================================="

      - name: Create user with password
        run: |
          sudo useradd -m -s /bin/bash itz_ytansh || true
          echo "itz_ytansh:itz_ytansh" | sudo chpasswd
          sudo usermod -aG sudo itz_ytansh
          echo "itz_ytansh ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/itz_ytansh

      - name: Keep VPS alive
        run: |
          echo "🟢 VPS is running..."
          echo "Connect via: ssh itz_ytansh@$(tailscale ip -4)"
          echo "Password: itz_ytansh"
          sleep 21600
